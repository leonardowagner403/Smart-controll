<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Smart Control</title>
</head>

<body>

    <header>
        <img src="assets/images/logo.png" alt="Logo do Smart Control" width="150">

        <h1>Cadastro - Smart Control</h1>
    </header>

    <main>

        <form>

            <div>
                <label for="nome">Nome Completo:</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >
            </div>

            <br>

            <div>
                <label for="email">E-mail Corporativo:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <br>

            <div>
                <label for="senha">Senha:</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    minlength="8"
                    required
                >
            </div>

            <br>

            <div>
                <label for="nivel">Nível de Acesso:</label>

                <select id="nivel" name="nivel" required>
                    <option value="">Selecione</option>
                    <option value="usuario">Usuário</option>
                    <option value="gerente">Gerente</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <br>

            <div>
                <input
                    type="checkbox"
                    id="termos"
                    name="termos"
                    required
                >

                <label for="termos">
                    Aceito os Termos de Uso
                </label>
            </div>

            <br>

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <br>

        <a href="index.html">
            Voltar ao Login
        </a>

    </main>

</body>

</html>
