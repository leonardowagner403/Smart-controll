<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Smart Control</title>
    
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        
        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header img {
            margin-bottom: 10px;
        }

        header h1 {
            color: #ffffff;
            font-size: 26px;
        }

        
        main {
            background-color: #000000;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgb(255, 0, 0); 
            text-align: center;
        }

        
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
        }

        
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #000000;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        select:focus {
            border-color: #0004fd;
            background-color: #ffffff;
            box-shadow: 0 0 5px rgba(4, 0, 255, 0.3);
        }

        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
            font-size: 15px;
            color: #ffffff;
            cursor: pointer;
        }

        .checkbox-group input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #df0505;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button[type="submit"]:hover {
            background-color: #ff0000; 

        }
        button[type="submit"]:active {
            transform: scale(0.98);
        }

        
        .link-login {
            display: inline-block;
            margin-top: 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .link-login:hover {
            text-decoration: underline;
        }
    </style> 
</head>

<body> 

    <header>
        <img src="assets/images/logo.png" alt="Logo do Smart Control" width="150">
        <h1>Cadastro - Smart Control</h1>
    </header>

    <main>

        <form>

            <div class="input-group">
                <label for="nome">Nome Completo:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">E-mail Corporativo:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    minlength="8"
                    required
                >
            </div>

            <div class="input-group">
                <label for="nivel">Nível de Acesso:</label>
                <select id="nivel" name="nivel" required>
                    <option value="">Selecione</option>
                    <option value="usuario">Usuário</option>
                    <option value="gerente">Gerente</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <div class="checkbox-group">
                <input
                    type="checkbox"
                    id="termos"
                    name="termos"
                    required
                >
                <label for="termos">
                    Aceito os Termos de Uso
                </label>
            </div>

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <a href="index.html" class="link-login">
            Voltar ao Login
        </a>

    </main>

</body>

</html>
